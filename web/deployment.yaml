apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  selector:
    matchLabels:
      app: web
  replicas: 1
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: myapp
          image: kimtsr/kort-web:1.0
          ports:
            - containerPort: 80
              name: web
